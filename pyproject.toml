[project]
name = "tk-request-console"
version = "1.0.0"
description = "Tkinter desktop console for composing and sending HTTP request/response messages against a config-driven endpoint template."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lucas de Lima" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.scripts]
tk-request-console = "tk_request_console.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tk_request_console"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
markers = [
    "gui: tests that require a real Tk display",
]
testpaths = ["tests"]
